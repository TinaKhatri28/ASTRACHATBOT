<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASTRABOT - AI Assistant</title>
    <!-- Modern Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">
                <i class="fa-solid fa-seedling"></i>
                <span>ASTRABOT</span>
            </div>
            
            <button class="new-chat-btn" onclick="location.reload()">
                <i class="fa-solid fa-plus"></i> New Chat
            </button>
            
            <div class="sidebar-footer">
                <div class="settings-btn">
                    <i class="fa-solid fa-gear"></i> Settings
                </div>
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="chat-area">
            <!-- Header -->
            <header class="chat-header">
                <h2>Mistral-7B Intelligence</h2>
                <div class="status">
                    <span class="status-dot"></span> Online
                </div>
            </header>

            <!-- Chat Messages Container -->
            <div class="chat-container" id="chatContainer">
                <!-- Welcome Message -->
                <div class="message ai-message">
                    <div class="avatar">
                        <i class="fa-solid fa-robot"></i>
                    </div>
                    <div class="message-content">
                        <p>Hello! I am ASTRABOT, your advanced AI assistant powered by Mistral-7B. How can I help you today?</p>
                    </div>
                </div>
            </div>

            <!-- Input Area -->
            <div class="input-area">
                <div class="input-wrapper">
                    <button id="voiceBtn" class="action-btn" title="Speak to ASTRABOT">
                        <i class="fa-solid fa-microphone"></i>
                    </button>
                    
                    <input type="text" id="userInput" placeholder="Ask ASTRABOT anything..." autocomplete="off">
                    
                    <button id="sendBtn" class="action-btn send-btn" title="Send Message">
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>
                </div>
                <div class="footer-text">
                    ASTRABOT can make mistakes. Consider verifying important information.
                </div>
            </div>
        </main>
    </div>

    <!-- Hidden audio element for TTS playback -->
    <audio id="ttsAudio" style="display: none;"></audio>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
